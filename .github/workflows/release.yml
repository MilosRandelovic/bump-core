name: Release

on:
  push:
    branches: [ main ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.1'

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      run: go test ./...

    - name: Build sidecar binary
      run: make build

    - name: Extract version
      id: version
      run: |
        VERSION=$(./bump-core --version)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Validate version
      run: |
        if ! grep -Fqx "## [${{ steps.version.outputs.version }}]" CHANGELOG.md; then
          echo "::error::CHANGELOG.md has no section for version ${{ steps.version.outputs.version }}."
          exit 1
        fi
        if git show-ref --verify --quiet "refs/tags/${{ steps.version.outputs.tag }}"; then
          echo "::error::Tag ${{ steps.version.outputs.tag }} already exists. Bump shared.Version before merging to main."
          exit 1
        fi
        echo "skip=false" >> $GITHUB_OUTPUT
      id: check_tag

    - name: Get previous tag for release notes
      if: steps.check_tag.outputs.skip != 'true'
      id: previous_tag
      run: |
        git fetch --tags --prune-tags
        PREVIOUS_TAG=$(git tag -l --sort=-version:refname | head -n1 || echo "")
        echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

    - name: Create and push tag
      if: steps.check_tag.outputs.skip != 'true'
      run: |
        git tag "${{ steps.version.outputs.tag }}"
        git push origin "${{ steps.version.outputs.tag }}"

    - name: Generate release notes
      if: steps.check_tag.outputs.skip != 'true'
      id: release_notes
      run: |
        PREVIOUS_TAG="${{ steps.previous_tag.outputs.previous_tag }}"
        NOTES_FILE="$RUNNER_TEMP/release-notes.md"
        if [ -n "$PREVIOUS_TAG" ]; then
          git log --no-merges --pretty=format:"- %s %h" "${PREVIOUS_TAG}..HEAD" > "$NOTES_FILE"
        else
          git log --no-merges --pretty=format:"- %s %h" -50 > "$NOTES_FILE"
        fi
        echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      if: steps.check_tag.outputs.skip != 'true'
      run: gh release create "$RELEASE_TAG" --title "Release $RELEASE_TAG" --notes-file "$RELEASE_NOTES_FILE"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
        RELEASE_NOTES_FILE: ${{ steps.release_notes.outputs.notes_file }}

    - name: Notify homebrew-bump
      if: steps.check_tag.outputs.skip != 'true'
      run: |
        curl --fail-with-body --silent --show-error -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: token ${{ secrets.HOMEBREW_BUMP_PAT }}" \
          https://api.github.com/repos/MilosRandelovic/homebrew-bump/dispatches \
          -d '{"event_type": "bump-core-release", "client_payload": {"version": "${{ steps.version.outputs.version }}",  "tag": "${{ steps.version.outputs.tag }}"}}'
