name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Install dependencies
      run: go mod download

    - name: Check formatting
      run: test -z "$(gofmt -l .)"

    - name: Run go vet
      run: go vet ./...

    - name: Run tests
      run: go test ./...

    - name: Run race detector
      run: go test -race ./...

    - name: Build
      run: make build

    - name: Check version output
      run: ./bump-core --version
